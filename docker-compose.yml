# WBTV - your own media as a live TV guide.
# On the LXC this lives in /opt/stacks/wbtv/compose.yaml (Dockge).
services:
  wbtv:
    image: wb20244/wbtv:latest
    container_name: wbtv
    restart: unless-stopped
    ports:
      - 8420:8080
    environment:
      - TZ=Europe/London
      # - WBTV_WIDTH=1280      # stream resolution
      # - WBTV_HEIGHT=720
      # - WBTV_CRF=23          # x264 quality (lower = better/bigger)
      # - WBTV_PRESET=veryfast # x264 speed preset
    # devices:                            # optional: GPU encoding (Intel/AMD VAAPI), see README
    #   - /dev/dri:/dev/dri
    volumes:
      - /opt/wbtv:/config                  # database + downloaded ads
      - /mnt/Main20TB:/mnt/Main20TB:ro    # media root (same path as on the host)
    tmpfs:
      - /tmp/wbtv:size=2g                  # live HLS segments incl. the pause/rewind buffer (RAM)
