<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WBTV</title>
  <script>document.documentElement.dataset.theme = localStorage.getItem("wbtv-theme") || "classic";</script>
  <link rel="icon" type="image/png" href="/img/icon.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <div class="player" id="player">
      <video id="video" playsinline></video>
      <div class="osd" id="osd"></div>
      <button class="backbtn" id="backBtn">☰ Back to Guide</button>
      <div class="nosignal" id="nosignal"><img src="/img/logo-stripes.png" alt="WBTV"><span>Select a channel and press Enter</span></div>
    </div>
    <div class="info" id="info"></div>
    <div class="clock" id="clock"></div>
  </header>
  <main class="guide" id="guide"><div class="loading"><img src="/img/splash.png" alt="Loading your TV guide"></div></main>
  <footer class="keys">
    <img class="brand" src="/img/logo.png" alt="WBTV"><span><b>↑↓←→</b> browse</span><span><b>Enter</b> watch</span><span><b>0-9</b> channel</span>
    <span><b>PgUp/PgDn</b> ch ±</span><span><b>F</b> fullscreen</span><span><b>G / Esc</b> guide</span><span><b>M</b> mute</span>
    <button id="settingsBtn">⚙ Setup</button>
  </footer>
  <div id="modal" class="modal hidden"></div>
  <script src="/vendor/hls.min.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
